<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Code and Create" />
    <title>Kushagra's World</title>
    <meta
      key="banner"
      property="og:image"
      content="https://kushagra.dev/images/social.jpeg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1a1530" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06050c" media="(prefers-color-scheme: dark)" />

    <script
      src="https://analytics.ahrefs.com/analytics.js"
      data-key="aXuLgPwQIm96xXrMJSEfGw"
      async
    ></script>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />

    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS"
      href="/feed/rss.xml"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="modulepreload" href="/js/vendor/three.module.min.js" />
    <link rel="modulepreload" href="/js/room.js" />
    <link rel="modulepreload" href="/js/chiptune.js" />

    <style>
      :root {
        --main-text-color: #dcb236;
        --ink: #fffbef;
        --bg: #1a1530;
        --pixel: 3px;
        /* day look; the night set is swapped in by the OS scheme or the cloud lamp */
        --page-bg: linear-gradient(180deg, #141142 0%, #2b2456 70%, #46345a 100%);
        --shade-top: rgba(20, 17, 50, 0.55);
        --shade-bottom: rgba(20, 17, 50, 0.8);
        --shade-mid: rgba(20, 17, 50, 0.35);
        --scan: 0.2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: linear-gradient(180deg, #06050c 0%, #0c0a1c 70%, #14101f 100%);
          --shade-top: rgba(4, 3, 12, 0.5);
          --shade-bottom: rgba(4, 3, 12, 0.75);
          --shade-mid: rgba(4, 3, 12, 0.3);
          --scan: 0.12;
        }
      }
      :root[data-room-theme="dark"] {
        --page-bg: linear-gradient(180deg, #06050c 0%, #0c0a1c 70%, #14101f 100%);
        --shade-top: rgba(4, 3, 12, 0.5);
        --shade-bottom: rgba(4, 3, 12, 0.75);
        --shade-mid: rgba(4, 3, 12, 0.3);
        --scan: 0.12;
      }
      :root[data-room-theme="light"] {
        --page-bg: linear-gradient(180deg, #141142 0%, #2b2456 70%, #46345a 100%);
        --shade-top: rgba(20, 17, 50, 0.55);
        --shade-bottom: rgba(20, 17, 50, 0.8);
        --shade-mid: rgba(20, 17, 50, 0.35);
        --scan: 0.2;
      }
      *:focus-visible {
        outline: 3px solid var(--main-text-color);
        outline-offset: 4px;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        background: var(--page-bg);
        color: var(--ink);
        transition: background 0.8s ease;
        font-family: "Fugaz One", cursive;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ---- the room ---------------------------------------------------- */
      .room {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        opacity: 0;
        transition: opacity 0.9s ease;
        cursor: grab;
      }
      .room.is-ready {
        opacity: 1;
      }
      /* readability shades: bottom-left for the title, top for nav */
      .shade {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background:
          linear-gradient(180deg, var(--shade-top) 0%, transparent 22%),
          linear-gradient(0deg, var(--shade-bottom) 0%, var(--shade-mid) 28%, transparent 55%);
      }
      /* subtle scanlines, same trick as before */
      .overlay {
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 70%,
          rgba(0, 0, 0, 0.4)
        );
        background-size: var(--pixel) var(--pixel);
        pointer-events: none;
        position: fixed;
        z-index: 3;
        inset: 0;
        opacity: var(--scan);
        mix-blend-mode: multiply;
      }

      /* ---- UI layer ------------------------------------------------------ */
      .ui {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "logo nav"
          ". ."
          "title social";
        padding: clamp(16px, 2.5vw, 36px) clamp(18px, 3vw, 44px);
        padding-bottom: max(clamp(16px, 2.5vw, 36px), env(safe-area-inset-bottom));
        pointer-events: none;
        font-size: clamp(16px, 1.2vw + 8px, 26px);
      }
      .ui a {
        pointer-events: auto;
      }

      a {
        color: var(--main-text-color);
        position: relative;
        text-decoration: none;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.55);
      }
      a:after {
        content: attr(data-anchor);
        display: block;
        position: absolute;
        color: white;
        left: 0;
        top: 0;
        clip-path: polygon(0 0, 0px 0, 0px 100%, 0 100%);
        transition: 0.5s ease;
      }
      a:hover:after,
      a:focus:after {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }

      header,
      footer {
        display: flex;
        gap: clamp(14px, 2.4vw, 44px);
        align-items: center;
        opacity: 0;
        animation: show-y cubic-bezier(0.19, 1, 0.22, 1) 1s forwards;
        animation-delay: 1s;
      }
      header {
        --starting-y: -30px;
        grid-area: nav;
        justify-self: end;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      footer {
        --starting-y: 30px;
        grid-area: social;
        align-self: end;
        justify-self: end;
        font-size: 0.72em;
      }

      .title-wrap {
        grid-area: title;
        align-self: end;
        line-height: 1;
        perspective: 800px;
        /* pivot from the bottom-left so the skew lifts the right side instead of sinking the left */
        transform-origin: 0 100%;
        transform: skew(0deg, -3.3deg) rotateY(-10deg);
        transform-style: preserve-3d;
        max-width: 100%;
        padding-bottom: 0.35em;
        font-size: 1.15em;
      }
      .sub-title {
        --starting-y: 10px;
        font-family: "Fugaz One", cursive;
        font-size: 1.25em;
        animation: show-y 0.3s ease-in-out forwards;
        animation-delay: 0.7s;
        opacity: 0;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
      }
      .title {
        --starting-x: -3vw;
        font-family: "Press Start 2P", cursive;
        font-size: clamp(34px, 5.3vw, 86px);
        text-transform: uppercase;
        margin: 0.35em 0 0.3em;
        color: var(--main-text-color);
        text-shadow:
          4px 0 #0000007d,
          0 4px #0000007d,
          4px 4px 0 rgba(0, 0, 0, 0.7),
          8px 8px 0 rgba(0, 0, 0, 0.25);
        opacity: 0;
        animation: show-x 0.6s ease-in-out forwards;
        line-height: 1.15;
      }
      .title-wrap p {
        margin: 0;
        font-size: 1.25em;
        opacity: 0;
        animation: show 0.3s ease-in-out forwards 0.6s;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
      }
      .title-wrap strike {
        opacity: 0.75;
      }

      .logo-wrap {
        grid-area: logo;
        width: clamp(90px, 9vw, 150px);
        aspect-ratio: 1;
        opacity: 0;
        animation: show 0.3s ease-in-out forwards 0.6s;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        pointer-events: none;
        margin: -0.5em 0 0 -0.5em;
      }
      .logo {
        width: 100%;
        height: 100%;
        animation: rotate 15s linear forwards infinite;
      }
      .text {
        font-weight: 600;
        letter-spacing: -2.3px;
        text-transform: uppercase;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
        font-size: 1.5rem;
        fill: #fffef7;
        text-shadow: 2px -1px #0000009c;
      }

      /* label that floats above a hovered object in the room */
      .tip {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 2;
        pointer-events: none;
        font-family: "Press Start 2P", cursive;
        font-size: 11px;
        color: #1a1530;
        background: var(--main-text-color);
        padding: 8px 10px 7px;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5);
        opacity: 0;
        transition: opacity 0.15s ease;
        white-space: nowrap;
      }
      .tip:after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -6px;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        background: var(--main-text-color);
      }
      .tip.is-visible {
        opacity: 1;
      }
      .hint {
        position: fixed;
        left: 50%;
        bottom: clamp(16px, 2.5vw, 36px);
        transform: translateX(-50%);
        z-index: 2;
        font-family: "Press Start 2P", cursive;
        font-size: 9px;
        letter-spacing: 1px;
        color: rgba(255, 251, 239, 0.55);
        pointer-events: none;
        opacity: 0;
        animation: show 1s ease forwards 2.6s;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.6);
      }
      .no-webgl .hint,
      .no-webgl .tip {
        display: none;
      }

      @keyframes show-x {
        0% {
          opacity: 0;
          transform: translateX(var(--starting-x));
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes show-y {
        0% {
          opacity: 0;
          transform: translateY(var(--starting-y));
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes show {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 760px) {
        :root {
          --pixel: 2px;
        }
        .ui {
          grid-template-columns: 1fr;
          grid-template-areas:
            "nav"
            "."
            "title"
            "social";
          font-size: 17px;
          row-gap: 18px;
        }
        header {
          justify-self: stretch;
          justify-content: space-between;
          flex-wrap: nowrap;
          white-space: nowrap;
          gap: 6px;
          font-size: 0.82em;
        }
        footer {
          justify-self: start;
          gap: 22px;
        }
        .logo-wrap {
          display: none;
        }
        .title {
          font-size: clamp(26px, 8.8vw, 44px);
        }
        .title-wrap {
          transform: skew(0deg, -2.5deg);
          font-size: 1.05em;
        }
        .title-wrap p,
        .sub-title {
          font-size: 1.05em;
        }
        .hint {
          display: none;
        }
        .tip {
          font-size: 10px;
        }
      }
      /* narrow phones: one more step down so the name never wraps */
      @media (max-width: 380px) {
        .ui {
          font-size: 15px;
        }
        header {
          font-size: 0.78em;
        }
        .title-wrap {
          font-size: 0.95em;
        }
      }
      /* phones on their side: short viewport, keep the room visible */
      @media (max-height: 480px) and (orientation: landscape) {
        .ui {
          font-size: 14px;
          padding: 12px 18px;
          row-gap: 6px;
        }
        .logo-wrap {
          display: none;
        }
        .sub-title {
          display: none;
        }
        .title {
          font-size: clamp(18px, 6.5vh, 34px);
          margin: 0 0 0.25em;
        }
        .title-wrap {
          font-size: 0.9em;
          padding-bottom: 0.2em;
        }
        .title-wrap p {
          font-size: 1em;
        }
        header {
          gap: 14px;
          font-size: 0.9em;
        }
        footer {
          font-size: 0.65em;
          gap: 16px;
        }
        .hint {
          display: none;
        }
      }
        .shade {
          background:
            linear-gradient(180deg, var(--shade-top) 0%, transparent 26%),
            linear-gradient(0deg, var(--shade-bottom) 0%, var(--shade-mid) 34%, transparent 60%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo {
          animation: none;
        }
      }

    </style>
  </head>

  <body>
    <canvas class="room js-room" id="room" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>

    <div class="ui">
      <div class="logo-wrap" aria-hidden="true">
        <svg viewBox="0 0 200 200" width="200" height="200" class="logo">
          <path
            id="curve"
            style="display: none"
            d="M 100 50
            a 50 50 0 0 1 0 100
            a 50 50 0 0 1 0 -100"
          />
          <text width="400">
            <textPath
              alignment-baseline="top"
              xlink:href="#curve"
              class="text"
            >
              Building things • since 2007 •
            </textPath>
          </text>
        </svg>
      </div>

      <header>
        <a href="/lab/" data-anchor="Lab" data-room="Lab" aria-label="Lab">Lab</a>
        <a href="/app-store/" data-anchor="Apps" data-room="Apps" aria-label="App Store">Apps</a>
        <a
          href="/frontend-bootcamp/"
          data-anchor="Bootcamp"
          data-room="Bootcamp"
          aria-label="Bootcamp"
          >Bootcamp</a
        >
        <a href="/games/" data-anchor="Games" data-room="Games" aria-label="Games">Games</a>
        <a href="/blog/" data-anchor="Blog" data-room="Blog" aria-label="Blog">Blog</a>
        <a href="/about/" data-anchor="About" data-room="About" aria-label="About">About</a>
      </header>

      <div class="title-wrap">
        <div class="js-sub-title sub-title">Your creative guy</div>

        <h1 class="title">Kushagra <br />Gour.</h1>
        <p><strike>Award winning</strike> Frontend Developer</p>
      </div>

      <footer>
        <a
          href="https://x.com/cssmonk"
          data-anchor="Twitter"
          aria-label="Twitter"
          >Twitter</a
        >
        <a
          href="https://github.com/chinchang"
          data-anchor="Github"
          aria-label="Github"
          >Github</a
        >
        <a
          href="https://cssbattle.dev/player/chinchang"
          data-anchor="CSSBattle"
          aria-label="CSSBattle"
          >CSSBattle</a
        >
      </footer>
    </div>

    <div class="tip js-tip" aria-hidden="true"></div>
    <div class="hint js-hint" aria-hidden="true">drag to look around &nbsp;·&nbsp; click around</div>

    <div class="overlay"></div>

    <script>
      setTimeout(() => {
        document.querySelector(".js-sub-title").textContent += "!";
        document.body.classList.add("loaded");
      }, 2000);
    </script>
    <script type="module">
      import { createRoom } from "/js/room.js";
      const canvas = document.querySelector(".js-room");
      try {
        const room = createRoom(canvas);
        room.setTooltip(document.querySelector(".js-tip"));
        // lighting follows the OS theme; ?theme=dark|light forces one for previewing
        const forced = new URLSearchParams(location.search).get("theme");
        if (forced === "dark" || forced === "light") room.setTheme(forced);
        requestAnimationFrame(() => canvas.classList.add("is-ready"));
        // nav links light up their object in the room
        document.querySelectorAll("[data-room]").forEach((a) => {
          a.addEventListener("mouseenter", () => room.highlight(a.dataset.room));
          a.addEventListener("focus", () => room.highlight(a.dataset.room));
          a.addEventListener("mouseleave", () => room.highlight(null));
          a.addEventListener("blur", () => room.highlight(null));
        });
        window.__room = room;
      } catch (e) {
        console.warn("Room could not start", e);
        document.body.classList.add("no-webgl");
      }
    </script>

    {% include 'analytics.html' %}
  </body>
</html>
